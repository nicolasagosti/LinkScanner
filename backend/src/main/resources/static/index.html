<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkScanner: prueba manual</title>
<style>
	:root {
		color-scheme: light dark;
		--bg: #f6f7f9;
		--card: #ffffff;
		--text: #1a1d21;
		--muted: #5c6470;
		--border: #d9dde3;
		--accent: #2456c9;
		--safe: #1b7a43;
		--unknown: #5c6470;
		--suspicious: #a86400;
		--dangerous: #c02b2b;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #14171b;
			--card: #1d2126;
			--text: #e8eaed;
			--muted: #a0a8b3;
			--border: #343a42;
			--accent: #7ea2f5;
			--safe: #4cc384;
			--unknown: #a0a8b3;
			--suspicious: #e5a93c;
			--dangerous: #f27272;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
	h1 { font-size: 1.5rem; margin: 0; }
	h2 { font-size: 1rem; margin: 24px 0 8px; }
	.subtitle { color: var(--muted); margin: 4px 0 24px; }
	form { display: flex; gap: 8px; }
	input {
		flex: 1;
		min-width: 0;
		padding: 10px 12px;
		font: inherit;
		color: inherit;
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 8px;
	}
	button {
		font: inherit;
		cursor: pointer;
		border-radius: 8px;
	}
	button[type="submit"] {
		padding: 10px 18px;
		color: #fff;
		background: #2456c9;
		border: 1px solid #2456c9;
		font-weight: 600;
	}
	button:disabled { opacity: 0.6; cursor: progress; }
	:is(input, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
	.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; color: var(--muted); font-size: 0.875rem; }
	.examples button {
		padding: 2px 10px;
		color: var(--text);
		background: transparent;
		border: 1px solid var(--border);
	}
	.card {
		margin-top: 24px;
		padding: 20px;
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 12px;
	}
	.card[hidden] { display: none; }
	.error { border-color: var(--dangerous); color: var(--dangerous); overflow-wrap: anywhere; }
	.verdict { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 5px solid var(--verdict-color); }
	.verdict strong { font-size: 1.25rem; color: var(--verdict-color); }
	.verdict-SAFE { --verdict-color: var(--safe); }
	.verdict-UNKNOWN { --verdict-color: var(--unknown); }
	.verdict-SUSPICIOUS { --verdict-color: var(--suspicious); }
	.verdict-DANGEROUS { --verdict-color: var(--dangerous); }
	.host { margin: 16px 0 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 0.9375rem; }
	.score { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 0.875rem; color: var(--muted); }
	.bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
	.bar div { height: 100%; background: var(--verdict-color, var(--unknown)); transition: width 0.2s; }
	.scan { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; font-size: 0.9375rem; }
	.services { margin: 4px 0 0; color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.8125rem; }
	.spinner {
		flex: none;
		width: 14px;
		height: 14px;
		border: 2px solid var(--border);
		border-top-color: var(--accent);
		border-radius: 50%;
		animation: spin 0.9s linear infinite;
	}
	@keyframes spin { to { transform: rotate(360deg); } }
	@media (prefers-reduced-motion: reduce) {
		.spinner { animation-duration: 3s; }
		.bar div { transition: none; }
	}
	ul { list-style: none; margin: 0; padding: 0; }
	li { padding: 10px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
	li small { display: block; color: var(--muted); font-family: ui-monospace, monospace; }
	.empty { margin: 0; color: var(--muted); }
	details { margin-top: 20px; font-size: 0.875rem; }
	summary { cursor: pointer; color: var(--muted); }
	pre { margin: 8px 0 0; padding: 12px; overflow-x: auto; background: var(--bg); border-radius: 8px; }
</style>
</head>
<body>
<main>
	<h1>LinkScanner</h1>
	<p class="subtitle">Herramienta de prueba del backend. Analiza el link sin abrirlo desde tu navegador.</p>

	<form id="form">
		<input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
			maxlength="2048" required aria-label="Link a analizar" placeholder="https://ejemplo.com/">
		<button id="submit" type="submit">Analizar</button>
	</form>

	<div class="examples">
		<span>Ejemplos (con key, gastan cuota):</span>
		<button type="button" data-url="https://www.mercadopago.com.ar/">oficial</button>
		<button type="button" data-url="https://rnercadopago.com/">imita a una marca</button>
		<button type="button" data-url="https://bbva-seguridad.xyz/token">menciona una marca</button>
		<button type="button" data-url="javascript:alert(1)">inválido</button>
		<button type="button" data-url="https://example.com/">sin señales</button>
	</div>

	<section id="error" class="card error" role="alert" hidden></section>

	<section id="result" class="card" aria-live="polite" hidden>
		<div id="verdict" class="verdict">
			<strong id="verdict-label"></strong>
			<span id="verdict-text"></span>
		</div>
		<p id="host" class="host"></p>
		<div class="score">
			<span>Puntaje</span>
			<div class="bar"><div id="score-bar"></div></div>
			<span id="score-value"></span>
		</div>
		<p class="scan">
			<span id="scan-spinner" class="spinner" hidden></span>
			<span id="scan-text"></span>
		</p>
		<p id="scan-services" class="services"></p>
		<h2>Motivos</h2>
		<ul id="findings"></ul>
		<p id="no-findings" class="empty">No se detectaron señales de riesgo.</p>
		<details>
			<summary>Respuesta de la API</summary>
			<pre id="raw"></pre>
		</details>
	</section>
</main>

<script>
	const API = "/api/v1/analyze";
	const POLL_INTERVAL_MS = 3000;
	const POLL_TIMEOUT_MS = 210000;

	const VERDICTS = {
		SAFE: ["SAFE", "No se detectaron riesgos."],
		UNKNOWN: ["UNKNOWN", "Sin señales de riesgo, pero sin verificar. No significa que sea seguro."],
		SUSPICIOUS: ["SUSPICIOUS", "Tiene señales de riesgo."],
		DANGEROUS: ["DANGEROUS", "Tiene señales fuertes de phishing."],
	};

	const SCANS = {
		SKIPPED: "Contenido sin revisar: no es un sitio público o no hay API key.",
		PENDING: "Revisando el link. VirusTotal puede tardar más de un minuto...",
		COMPLETED: "Todos los servicios revisaron el link.",
		UNAVAILABLE: "No todos los servicios pudieron revisar el link. Esto no significa que esté limpio.",
	};

	const $ = (id) => document.getElementById(id);

	// Cada análisis nuevo invalida el seguimiento del anterior.
	let currentRun = 0;

	function showError(message) {
		$("error").textContent = message;
		$("error").hidden = false;
	}

	// host y los mensajes pueden traer texto armado por un atacante: solo se insertan como texto.
	function render(data) {
		const [label, text] = VERDICTS[data.verdict] ?? [data.verdict, ""];
		$("verdict").className = "verdict verdict-" + data.verdict;
		$("result").style.setProperty("--verdict-color", `var(--${String(data.verdict).toLowerCase()})`);
		$("verdict-label").textContent = label;
		$("verdict-text").textContent = text;
		$("host").textContent = data.host;
		$("score-bar").style.width = data.score + "%";
		$("score-value").textContent = data.score + " / 100";
		$("scan-text").textContent = SCANS[data.contentScan] ?? data.contentScan;
		$("scan-spinner").hidden = data.contentScan !== "PENDING";
		$("scan-services").textContent = Object.entries(data.scans ?? {})
			.map(([service, status]) => `${service}: ${status}`)
			.join(" · ");

		$("findings").replaceChildren(...data.findings.map((finding) => {
			const item = document.createElement("li");
			const code = document.createElement("small");
			code.textContent = `${finding.code} · +${finding.weight}`;
			item.append(finding.message, code);
			return item;
		}));
		$("no-findings").hidden = data.findings.length > 0;
		$("raw").textContent = JSON.stringify(data, null, 2);
		$("result").hidden = false;
	}

	async function readResponse(response) {
		const data = await response.json().catch(() => null);
		if (!response.ok) {
			throw new Error(data?.detail ?? `El backend respondió ${response.status}`);
		}
		return data;
	}

	async function poll(data, run) {
		const deadline = Date.now() + POLL_TIMEOUT_MS;
		let latest = data;
		while (latest.contentScan === "PENDING") {
			await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS));
			if (run !== currentRun) {
				return;
			}
			if (Date.now() > deadline) {
				throw new Error("El escaneo tardó demasiado.");
			}
			latest = await readResponse(await fetch(`${API}/${encodeURIComponent(data.scanId)}`));
			if (run !== currentRun) {
				return;
			}
			render(latest);
		}
	}

	async function analyze(url) {
		const run = ++currentRun;
		$("error").hidden = true;
		$("result").hidden = true;
		$("submit").disabled = true;
		try {
			const data = await readResponse(await fetch(API, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ url }),
			}));
			if (run !== currentRun) {
				return;
			}
			render(data);
			$("submit").disabled = false;
			await poll(data, run);
		}
		catch (error) {
			if (run === currentRun) {
				$("scan-spinner").hidden = true;
				const offline = error instanceof TypeError;
				showError(offline ? "No se pudo conectar con el backend." : error.message);
			}
		}
		finally {
			if (run === currentRun) {
				$("submit").disabled = false;
			}
		}
	}

	$("form").addEventListener("submit", (event) => {
		event.preventDefault();
		analyze($("url").value);
	});

	document.querySelectorAll("[data-url]").forEach((button) => {
		button.addEventListener("click", () => {
			$("url").value = button.dataset.url;
			analyze(button.dataset.url);
		});
	});
</script>
</body>
</html>
